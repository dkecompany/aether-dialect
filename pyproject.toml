[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aetherdialect"
version = "0.1.8"
description = "The deterministic Text-to-SQL engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Akul Ameya", email = "akul.ameya@armhub.com.au"}]
dependencies = [
    "pandas>=2.0,<3",
    "packaging>=23.0,<25",
    "jsonschema>=4.0,<5",
    "openai>=2.0.0,<3",
    "platformdirs>=2.0.0,<5",
    "sqlglot>=29.0,<30",
    "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
sqlite = []
duckdb = ["duckdb-engine>=0.13,<1"]
csv = ["duckdb-engine>=0.13,<1"]
mysql = ["pymysql>=1.1,<2"]
mariadb = ["pymysql>=1.1,<2"]
sqlserver = ["pyodbc>=5,<6"]
postgresql = [
    "pglast>=5.0,<8",
    "psycopg2-binary>=2.9,<3",
]
redshift = [
    "sqlalchemy-redshift>=1.0,<2",
    "redshift-connector>=2.1.9,<3",
]
databricks = [
    "databricks-sqlalchemy>=2.0,<3",
]
snowflake = ["snowflake-sqlalchemy>=1.6,<2"]
bigquery = [
    "sqlalchemy-bigquery>=1.11,<2",
    "google-cloud-bigquery-storage>=2.0,<3",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "vulture>=2.16,<3",
    "ruff==0.15.9",
    "mypy>=1.10",
    "bandit[toml]==1.8.3",
    "twine>=5.0",
    "build>=1.0",
    "pre-commit>=3.0",
    "docformatter>=1.7,<2",
    "codespell>=2.4",
    "pandas-stubs>=2.0",
    "types-jsonschema>=4.0",
    "duckdb-engine>=0.13,<1",
    "pymysql>=1.1,<2",
    "pyodbc>=5,<6",
    "pglast>=5.0,<8",
    "psycopg2-binary>=2.9,<3",
    "sqlalchemy-redshift>=1.0,<2",
    "redshift-connector>=2.1.9,<3",
    "databricks-sqlalchemy>=2.0,<3",
    "snowflake-sqlalchemy>=1.6,<2",
    "sqlalchemy-bigquery>=1.11,<2",
    "google-cloud-bigquery-storage>=2.0,<3",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "live_tests", "scripts"]
exclude = [
    "dev_workspace",
    ".venv",
    "venv",
    ".pytest_cache",
    "__pycache__",
    "src/aetherdialect/__pycache__",
    "tests/__pycache__",
    "live_tests/__pycache__"
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/aetherdialect/_dialect_postgres.py" = ["E402"]
"src/aetherdialect/_sql_to_intent.py" = ["E402"]
"src/aetherdialect/_intent_expr.py" = ["E402"]
"src/aetherdialect/_schema_overrides.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.docformatter]
wrap-summaries = 72
wrap-descriptions = 72
style = "google"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
local_partial_types = true
show_error_codes = true
extra_checks = true

[[tool.mypy.overrides]]
module = [
    "pglast",
    "pglast.*",
    "snowflake",
    "snowflake.*",
    "pyspark",
    "pyspark.*",
    "google.cloud",
    "google.cloud.*",
    "databricks",
    "databricks.*",
    "redshift_connector",
    "redshift_connector.*",
    "duckdb",
    "duckdb.*",
    "pymysql",
    "pymysql.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "live_tests"]
pythonpath = ["src", "scripts", "."]
markers = [
    "fast: PR-loop tests; equals not requires_sandbox until data.zip passes sandbox_doctor(), then also quick sandbox corpus tests (excludes slow LLM matrix in test_sandbox_offline.py)",
    "requires_sandbox: needs bundled src/aetherdialect/sandbox/data.zip (offline_sandbox corpus)",
]

[tool.coverage.run]
source = ["src/aetherdialect"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.vulture]
min_confidence = 80
paths = ["src/aetherdialect"]
exclude = ["src/aetherdialect/__pycache__"]

[tool.bandit]
exclude_dirs = [
    "tests",
    "live_tests",
    ".venv",
    "venv",
    "dev_workspace",
    "scripts",
    ".github",
    ".pytest_cache",
    "MagicMock",
]
skips = [
    "B101",
    "B105",
    "B110",
    "B112",
    "B311",
    "B608",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["aetherdialect*"]
exclude = ["__pycache__"]

[tool.setuptools.package-data]
"aetherdialect" = [
    "sandbox/data.zip",
]

[project.urls]
Homepage = "https://github.com/dkecompany/aether-dialect"
