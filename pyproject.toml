[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aetherdialect"
version = "0.2.1"
description = "The deterministic Text-to-SQL engine"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Akul Ameya", email = "akul.ameya@armhub.com.au"}]
keywords = ["text-to-sql", "sql", "database", "analytics", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pandas>=2.0,<3",
    "packaging>=23.0,<25",
    "jsonschema>=4.0,<5",
    "openai>=2.0.0,<3",
    "platformdirs>=2.0.0,<5",
    "sqlglot>=29.0,<30",
    "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
duckdb = ["duckdb>=1.0,<2"]
federation = ["duckdb>=1.0,<2"]
sandbox = ["duckdb>=1.0,<2", "duckdb-engine>=0.13,<1"]
csv = ["openpyxl>=3.1,<4"]
mysql = ["pymysql>=1.1,<2"]
mariadb = ["pymysql>=1.1,<2"]
sqlserver = ["pyodbc>=5,<6"]
postgresql = [
    "pglast>=5.0,<8",
    "psycopg[binary]>=3.1,<4",
]
redshift = [
    "sqlalchemy-redshift>=1.0,<2",
    "redshift-connector>=2.1.9,<3",
]
databricks = [
    "databricks-sqlalchemy>=2.0,<3",
]
snowflake = ["snowflake-sqlalchemy>=1.6,<2"]
bigquery = [
    "sqlalchemy-bigquery>=1.11,<2",
    "google-cloud-bigquery-storage>=2.0,<3",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "vulture>=2.16,<3",
    "ruff==0.15.9",
    "mypy>=1.10",
    "bandit[toml]==1.8.3",
    "twine>=5.0",
    "build>=1.0",
    "pre-commit>=3.0",
    "docformatter>=1.7,<2",
    "codespell>=2.4",
    "pip-audit>=2.7",
    "pandas-stubs>=2.0",
    "types-jsonschema>=4.0",
    "openpyxl>=3.1,<4",
    "duckdb>=1.0,<2",
    "duckdb-engine>=0.13,<1",
    "pymysql>=1.1,<2",
    "pyodbc>=5,<6",
    "pglast>=5.0,<8",
    "psycopg[binary]>=3.1,<4",
    "sqlalchemy-redshift>=1.0,<2",
    "redshift-connector>=2.1.9,<3",
    "databricks-sqlalchemy>=2.0,<3",
    "snowflake-sqlalchemy>=1.6,<2",
    "sqlalchemy-bigquery>=1.11,<2",
    "google-cloud-bigquery-storage>=2.0,<3",
    "mutmut>=3.0.5,<4",
]

[tool.mutmut]
paths_to_mutate = [
    "src/aetherdialect/_validation_execute.py",
    "src/aetherdialect/_validation_schema.py",
    "src/aetherdialect/_validation_semantic.py",
    "src/aetherdialect/_intent_resolve.py",
    "src/aetherdialect/_intent_repair.py",
    "src/aetherdialect/_core_utils.py",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "live_tests", "scripts"]
exclude = [
    ".venv",
    "venv",
    ".pytest_cache",
    "__pycache__",
    "src/aetherdialect/__pycache__",
    "tests/__pycache__",
    "live_tests/__pycache__"
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.docformatter]
wrap-summaries = 72
wrap-descriptions = 72
style = "google"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
local_partial_types = true
show_error_codes = true
extra_checks = true

[[tool.mypy.overrides]]
module = [
    "pglast",
    "pglast.*",
    "snowflake",
    "snowflake.*",
    "pyspark",
    "pyspark.*",
    "google.cloud",
    "google.cloud.*",
    "databricks",
    "databricks.*",
    "redshift_connector",
    "redshift_connector.*",
    "pymysql",
    "pymysql.*",
    "pyarrow",
    "pyarrow.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "live_tests"]
pythonpath = ["src", "scripts", ".github/scripts", "."]
markers = [
    "fast: PR-loop tests; equals not needs_corpus until data.zip passes sandbox_doctor(), then also quick sandbox corpus tests (excludes slow LLM matrix in test_sandbox_offline.py)",
    "hygiene: static source/docs writing rules (AST/text), not behavioral coverage",
    "needs_corpus: needs bundled src/aetherdialect/sandbox/data.zip (offline_sandbox corpus)",
    "requires_sandbox: deprecated alias for needs_corpus",
    "live: requires live federation partition databases and LLM credentials",
    "live_no_llm: live database tests that must not call the LLM",
]

[tool.coverage.run]
source = ["src/aetherdialect"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.vulture]
min_confidence = 80
paths = ["src/aetherdialect"]
exclude = ["src/aetherdialect/__pycache__"]

[tool.bandit]
exclude_dirs = [
    "tests",
    "live_tests",
    ".venv",
    "venv",
    "scripts",
    ".github",
    ".pytest_cache",
    "MagicMock",
]
skips = [
    "B101",
    "B105",
    "B110",
    "B112",
    "B311",
    "B608",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["aetherdialect*"]
exclude = ["__pycache__"]

[tool.setuptools.package-data]
"aetherdialect" = [
    "py.typed",
    "sandbox/data.zip",
]

[project.urls]
Homepage = "https://github.com/dkecompany/aether-dialect"
Repository = "https://github.com/dkecompany/aether-dialect"
Issues = "https://github.com/dkecompany/aether-dialect/issues"
Documentation = "https://github.com/dkecompany/aether-dialect/blob/main/README.md"
